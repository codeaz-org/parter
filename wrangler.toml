# Cloudflare Pages: the site is the "public" folder, served as it is. There is no build step.
# The backend is functions/api; it needs the database and the bucket below.
name = "parter"
pages_build_output_dir = "public"
compatibility_date = "2026-01-01"

[vars]
CF_ACCOUNT_ID = "cc567f3407c4d2a648fff78698d722bc"
# MAIL_FROM = "signin@codeaz.org"   # set once the domain can send email; with the EMAIL_API_TOKEN secret this switches email sign-in on
PRICE_LABEL = "€15 a month"

[[d1_databases]]
binding = "DB"
database_name = "parter"
database_id = "504a145d-b86c-4ee9-bea5-0a0afb755ac8"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "parter-blobs"
